[workspace]
resolver = "3"
members = ["crates/cherry-core", "crates/cherry-control", "crates/cherryd", "crates/cherry"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.91 是 iroh-mdns-address-lookup 0.6 的下限。
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 传输层，见 ADR-0001 / ADR-0002。
# iroh-blobs 必须 >= 0.103.1：0.94~0.103.0 有请求掩码安全修复，push 一类请求
# 可能被意外放行。我们也不启用 push。
iroh = "1.3"
iroh-blobs = "0.103.1"
iroh-tickets = "1.0"
# mDNS 在 iroh 1.3 里已经拆出主 crate。ADR-0002 要求显式开它。
iroh-mdns-address-lookup = "0.6"
# iroh 1.3 用的就是 noq-proto 1.3，版本必须对齐，否则 ControllerFactory
# 不是同一个 trait。默认拥塞控制器（Cubic）见 endpoint.rs 里的说明。
noq-proto = "1.3.0"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
hex = "0.4"
getrandom = "0.2"
futures-lite = "2"

cherry-core = { path = "crates/cherry-core" }
cherry-control = { path = "crates/cherry-control" }
