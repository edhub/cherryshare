[workspace]
resolver = "3"
members = ["crates/cherry-core", "crates/cherry-control", "crates/cherryd", "crates/cherry"]

# 专供性能分析：跟 release 一样优化，但带符号。
# `sample` / `instruments` 对无符号的 release 二进制只能给 `???`。
# `strip = "none"` 和 `package."*".debug` 是必需的：全局 ~/.cargo/config.toml
# 里设了 `[profile.release] strip = true`，而这个 profile 继承自它。
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.profiling.package."*"]
debug = true
strip = "none"

[workspace.package]
version = "0.6.0"
edition = "2024"
# 依赖里要求最高的那个（最早是 iroh-mdns-address-lookup 0.6 的下限，那套已经删了，这个值没重新量过）。
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
dirs = "6"
hex = "0.4"
getrandom = "0.2"

# 把篮子当只读 NFS 导出的服务端。用它是因为对方系统自带 NFS 客户端，
# 不用装东西也不用我们写 FUSE。纯用户态，不碰内核。见 ADR-0007。
nfsserve = "0.11"
async-trait = "0.1"

# 网页那条路（第二个入口：不挂载也能看和拿）。页面是磁盘上的静态文件，不嵌进二进制。
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
# 打包下载：流式写 zip（`ZipWriter::new_stream` 不需要 Seek）。
# 只开 flate2 的 zlib-rs 后端：默认那个 `deflate` 会额外拖上 zopfli（很慢），
# 而且默认后端已经不是 miniz 了。级别选 2 的经过见 docs/performance.md。
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 把阻塞线程写的 zip 接给 HTTP 响应体用。
tokio-util = { version = "0.7", features = ["io", "rt", "io-util"] }

cherry-core = { path = "crates/cherry-core" }
cherry-control = { path = "crates/cherry-control" }
